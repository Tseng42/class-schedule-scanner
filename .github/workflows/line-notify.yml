name: LINE reminder tick

# Vercel's free plan only allows one cron run per day, which is enough for the
# morning summary but not for "N minutes before class". This pings the same
# endpoint every 10 minutes; the endpoint decides what (if anything) is due.
#
# GitHub delays scheduled runs under load and can drop them, so reminders can
# arrive late or occasionally not at all. Scheduled workflows are also disabled
# automatically after 60 days without repository activity.

on:
  schedule:
    # Offset from :00, where GitHub's scheduler is most congested.
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: line-notify
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository's secrets; skipping."
            exit 0
          fi
          # The endpoint answers with statuses only (no schedule contents): this log is public.
          curl -sS --max-time 60 -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://class-schedule-scanner.vercel.app/api/line-notify"
